[project]
name = "drake-ik-benchmark"
version = "0.0.1"
description = "A controlled benchmark of Drake's nonlinear solvers on iiwa7 + WSG inverse kinematics."
readme = "README.md"
requires-python = ">=3.13" #TODO: lauren's different

dependencies = [
    # TODO: check drake version on all machines
    
    # others ~=: stable behavior, each platform resolves to an installable wheel
    # do not affect ik results
    "numpy~=2.1",
    "pandas~=2.2",
    #"pyarrow~=18.0",   # TODO: fix import (parquet output)
    "pyyaml~=6.0",     # config loading
]

[project.optional-dependencies]
dev = [
    "pytest~=8.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
