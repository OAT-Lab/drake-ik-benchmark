# config for producing solver values

logging:
  level: INFO
  file: study.log
  mode: w
  quiet: false

# benchmark
seeds: [2, 9, 42]                         # 3 for seed robustness
orientation_tols: [0.0, 1e-4, 1e-3, 1e-2] 
n_per_cell: 640 

method_mix:
  joint_space: 0.5
  task_space: 0.5

time_step: 0.001
box:
  size: [0.1, 0.1, 1.0]       # matches mit textbook
  position: [0.25, 0.0, 0.5]

task_space:
  position_min: [-1.31, -1.31, 0.0] # size computed from gripper z pos
  position_max: [1.31, 1.31, 1.31]
  max_tilt_rad: 0.5

minimum_distance:
  use_minimum_distance: true
  min_distance_bound: 0.001
  influence_distance_offset: 0.1

tolerances:
  feasibility_tol: 1.0e-6
  optimality_tol: 1.0e-6
  major_iter_limit: 100000

nlopt:
  max_eval: 100000
  max_time_sec: 60.0

# recorded per (scenario, solver):
# q, objective, constraint values c(x) vs bounds, q vs joint limits
compare:
  feasibility_threshold: 1.0e-4

timing:
  n_warmup: 2
  n_repeats: 10